<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro to html basic tags :)</title>
  </head>
  <body>
    <h1>Yellow first line of code for 2026 HTML!</h1>
    <h2>this is a h2 tag a little smaller</h2>
    <h3>this is h3</h3>
    <h4>this is h4</h4>
    <h5>this is h5</h5>
    <h6>this is h6</h6>
    <!-- these are the header tags from 1 to 6, 1 the biggest and 6 the smallest for headers tag-->
    <p>Lorem ipsum dolor sit amet.</p>
    <!-- paragraph tag-->
    <a href="https://google.com" target="_blank">click here for google.com</a>
    <!-- anchor tag with href in the opening tag-->
    <em> this is italic</em>
    <!-- italic tag to get words looking italic-->
    <b> bold tag, to make words bold in html</b>
    <!-- bold tag to make words look bold-->
    <!-- now both em and b tags are inline tags-->
    <!-- now i could use a br to create line break-->
  </body>
</html>
